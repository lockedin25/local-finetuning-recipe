name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6.0'
      - run: python tools/audit.py
      - run: python -m compileall -q src tools tests experiments essay
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s src -p 'test_*.py' -v
