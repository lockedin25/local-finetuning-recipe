[project]
name = "local-finetuning-recipe"
version = "0.1.0"
description = "Reproducible local conversational fine-tuning recipes, without private data or checkpoints"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PyYAML>=6.0",
  "transformers>=4.57",
  "huggingface-hub>=0.36",
  "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
essay = ["markdown>=3.7", "matplotlib>=3.9"]
vision = ["mlx-vlm>=0.7.11; sys_platform == 'darwin' and platform_machine == 'arm64'"]
gpu = ["torch>=2.6", "peft>=0.17", "accelerate>=1.0"]
